[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wilson", email = "zhenglee315@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastapi-cache2>=0.2.2",
    "fastapi-pagination>=0.16.0",
    "fastapi-utils>=0.8.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "psutil>=5.9.8,<8",
    "python-socketio>=5.17.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "starsessions>=2.2.1",
    "typing-inspect>=0.9.0,<0.10.0",
    "uvicorn[standard]==0.54.0",
    "geoip2>=5.3.0",
    "apscheduler>=3.11.3,<4",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
collect_imported_tests = false

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# This view consumes public APIs through __all__; architecture tests verify those export lists.
"APPs/Management/views_management.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.13"
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = [
    "COMMON/schema/schema_user.py",
    "SYSTEM/database/migration_policy.py",
    "SYSTEM/tools/tools_net.py",
    "SYSTEM/tools/tools_geoip.py",
    "SYSTEM/tools/monitor_contracts.py",
    "SYSTEM/tools/monitor_worker.py",
    "SYSTEM/tools/monitor_snapshot.py",
    "SYSTEM/tools/monitor_stream.py",
    "SYSTEM/tools/monitor_supervisor.py",
    "SCHEDULER/SYSTEM/tools/tools_lock.py",
]

[tool.uv]
package = false
# Keep requests' optional charset detector portable and avoid loading native speedup binaries.
# Build this pure-Python wheel during online deployment preparation, then transfer the prepared image/cache.
no-binary-package = ["charset-normalizer"]
