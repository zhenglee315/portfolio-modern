<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="428"
  viewBox="0 0 1000 428"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">DataTable cell renderer styles</title>
  <desc id="desc">
    Illustration of text, checkbox, switch, toggle button and action buttons. Read-only BooleanCell
    differs from controlled render callbacks.
  </desc>
  <rect width="1000" height="428" rx="10" fill="#111c20" />
  <g font-family="Arial, sans-serif">
    <text x="28" y="34" font-size="20" fill="#80d6ce" font-weight="700">
      ROW DATA / RENDERER RECIPES
    </text>
    <text x="28" y="60" font-size="14" fill="#9eb3b7" font-weight="400">
      Use value for data; use render for the presentation and callbacks.
    </text>
    <rect x="20" y="82" width="960" height="60" rx="5" fill="#152126" stroke="#365154" />
    <text x="38" y="106" font-size="16" fill="#e4eeee" font-weight="600">Text</text>
    <text x="38" y="126" font-size="12" fill="#9eb3b7" font-weight="400">value: string</text>
    <text x="330" y="116" font-size="15" fill="#e4eeee" font-weight="400">
      A long profile introduction…
    </text>
    <text x="666" y="116" font-size="13" fill="#9eb3b7" font-weight="400">hover → full value</text>
    <rect x="20" y="146" width="960" height="60" rx="5" fill="#152126" stroke="#365154" />
    <text x="38" y="170" font-size="16" fill="#e4eeee" font-weight="600">Checkbox</text>
    <text x="38" y="190" font-size="12" fill="#9eb3b7" font-weight="400">BooleanCell checkbox</text>
    <rect x="330" y="165" width="22" height="22" rx="5" fill="#111c20" stroke="#365154" />
    <text x="366" y="181" font-size="13" fill="#9eb3b7" font-weight="400">false</text>
    <rect x="478" y="165" width="22" height="22" rx="5" fill="#80d6ce" stroke="#365154" />
    <g transform="translate(481 168) scale(1)" fill="#111c20" color="#111c20">
      <path
        d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"
      />
    </g>
    <text x="514" y="181" font-size="13" fill="#9eb3b7" font-weight="400">true</text>
    <text x="650" y="181" font-size="14" fill="#9eb3b7" font-weight="400">— null</text>
    <rect x="20" y="210" width="960" height="60" rx="5" fill="#152126" stroke="#365154" />
    <text x="38" y="234" font-size="16" fill="#e4eeee" font-weight="600">Switch / Toggle</text>
    <text x="38" y="254" font-size="12" fill="#9eb3b7" font-weight="400">
      BooleanCell or controlled input
    </text>
    <rect x="330" y="229" width="46" height="22" rx="11" fill="#111c20" stroke="#365154" />
    <circle cx="341" cy="240" r="7" fill="#547173" />
    <text x="390" y="245" font-size="13" fill="#9eb3b7" font-weight="400">false</text>
    <rect x="478" y="229" width="46" height="22" rx="11" fill="#80d6ce" stroke="#365154" />
    <circle cx="513" cy="240" r="7" fill="#111c20" />
    <text x="538" y="245" font-size="13" fill="#9eb3b7" font-weight="400">true</text>
    <text x="650" y="245" font-size="13" fill="#9eb3b7" font-weight="400">role="switch"</text>
    <rect x="20" y="274" width="960" height="60" rx="5" fill="#152126" stroke="#365154" />
    <text x="38" y="298" font-size="16" fill="#e4eeee" font-weight="600">Toggle button</text>
    <text x="38" y="318" font-size="12" fill="#9eb3b7" font-weight="400">
