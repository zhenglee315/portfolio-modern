    </text>
    <rect x="20" y="338" width="960" height="60" rx="5" fill="#152126" stroke="#365154" />
    <text x="38" y="362" font-size="16" fill="#e4eeee" font-weight="600">Button / Actions</text>
    <text x="38" y="382" font-size="12" fill="#9eb3b7" font-weight="400">render or rowActions</text>
