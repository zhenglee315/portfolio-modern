    </text>
    <rect x="330" y="286" width="102" height="36" rx="5" fill="#152126" stroke="#365154" />
    <text x="350" y="309" font-size="14" fill="#e4eeee" font-weight="400">Normal</text>
    <rect x="460" y="286" width="112" height="36" rx="5" fill="#80d6ce" stroke="#80d6ce" />
    <text x="478" y="309" font-size="14" fill="#111c20" font-weight="400">Featured</text>
    <text x="650" y="309" font-size="13" fill="#9eb3b7" font-weight="400">
